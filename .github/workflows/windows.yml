# 打包 Windows 版 Manna：推送 v 开头的标签（如 v1.1.0）时打包并上传到同名 Release；
# 也可以在 Actions 页面手动运行（只打包，安装包在本次运行的 Artifacts 里）。
name: Manna 安装包与发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: 打包
        shell: pwsh
        run: ./build_windows.ps1

      - name: 更新与字幕测试
        shell: pwsh
        run: |
          & .build\win\python\python.exe -B -m unittest test_subtitles test_app_updates
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 功能检查（转 H.264、回收站、剪贴板、外部工具）
        shell: pwsh
        env:
          MANNA_DENO: ${{ github.workspace }}\.build\win\deno\deno.exe
        run: |
          & .build\win\python\python.exe packaging\windows\check.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 启动检查（打开 Manna.exe，本地服务能访问）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Manna\Manna.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match "Manna") { $ok = $true; break }
            } catch {}
          }
          Start-Sleep -Seconds 5
          $alive = !$p.HasExited
          Get-Content "$env:APPDATA\Manna\manna.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "::warning::Manna.exe 已退出（退出码 $($p.ExitCode)），窗口可能没能显示" }
          if (!$ok) { throw "Manna.exe 启动后本地服务没有响应" }

      - name: 上传安装包（本次运行的 Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: Manna-Windows
          path: |
            dist/Manna-Setup-*.exe
            dist/Manna-*-Windows-portable.zip

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 测试
        run: python3 -B -m unittest test_subtitles test_app_updates
      - name: 打包
        env:
          ARCHES: ${{ matrix.arch }}
          NO_OPEN: '1'
          CI: 'true'
        run: bash build_mac.command
      - uses: actions/upload-artifact@v4
        with:
          name: Manna-Mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验版本标签
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from config import VERSION
          assert os.environ['RELEASE_TAG'] == 'v' + VERSION, '版本标签与 config.py 不一致'
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: Manna-*
          path: release-assets
          merge-multiple: true
      - name: 发布安装包
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --draft --title "Manna $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
